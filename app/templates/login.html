<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Вход — РПД</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f7f7f7;
        }

        h1, h2 {
            color: #222;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1100px;
        }

        .card {
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }

        .error {
            background: #ffecec;
            border: 1px solid #d88;
            padding: 10px;
            margin-bottom: 15px;
        }

        .success {
            background: #ecffec;
            border: 1px solid #8c8;
            padding: 10px;
            margin-bottom: 15px;
        }

        .role-option {
            margin-bottom: 8px;
        }

        .role-option input {
            width: auto;
            margin-right: 6px;
        }

        .small {
            font-size: 13px;
            color: #555;
        }
    </style>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>


<h1>РПД — ИИ-прототип</h1>

{% if error %}
    <div class="error">{{ t(error) }}</div>
{% endif %}

{% if success %}
    <div class="success">{{ success }}</div>
{% endif %}

<div class="container">

    <div class="card">
        <h2>Войти</h2>

        <form action="/login" method="post">
            <label>Электронная почта</label>
            <input type="email" name="email" value="{{ email or '' }}" required>

            <label>Пароль</label>
            <input type="password" name="password" required>

            <button type="submit">Войти</button>
        </form>
    </div>

    <div class="card">
        <h2>Создать учетную запись</h2>

        <form action="/register" method="post">
            <label>Имя</label>
            <input type="text" name="name" placeholder="Например: Анна Мария" required>

            <label>Электронная почта</label>
            <input type="email" name="email" placeholder="Например: anna@example.com" required>

            <label>Пароль</label>
            <input type="password" name="password" placeholder="Не менее 8 символов" required>

            <p>Роли</p>

            <div class="role-option">
                <label>
                    <input type="checkbox" name="roles" value="USER_TEACHER">Преподаватель</label>
            </div>

            <div class="role-option">
                <label>
                    <input type="checkbox" name="roles" value="USER_METHODIST">Методист</label>
            </div>

            <button type="submit">Создать учетную запись</button>
        </form>

        <p class="small">В прототипе регистрация открыта для демонстрации. В рабочей системе создание учетных записей обычно доступно администратору.</p>
    </div>

</div>

</body>
</html>
