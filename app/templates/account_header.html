<header class="top-bar account-header">
    <div class="account-heading"><h1>Панель управления РПД</h1><span class="account-identity"><strong>{{ user.name }}</strong><span>{{ user.email }}</span></span></div>
    <nav class="account-nav" aria-label="Аккаунт и роль">
        <span class="account-role"><span class="role-badge">{{ role_labels[active_role] }}</span>{% if user_roles | length > 1 %}<a href="/select-role">Сменить роль</a>{% endif %}</span>
        <a href="/admin/users">Пользователи</a>
        <a href="/logout">Выйти</a>
    </nav>
</header>
