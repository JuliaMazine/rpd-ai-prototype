<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Active Role - RPD-AI Prototype</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>

        body {
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 36px 32px;
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 24px;
            color: var(--text);
            text-align: center;
        }

        p {
            margin-bottom: 20px;
            color: var(--muted-strong);
        }

        .role-option {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            padding: 8px 12px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .role-option:hover {
            background: var(--bg-soft);
            border-color: var(--primary-light);
        }

        input[type="radio"] {
            width: auto;
            margin: 0;
        }

        label {
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
        }

        .card form button {
            width: auto;
            display: block;
            margin: 20px auto 0 auto;
            padding: 10px 28px;
            font-size: 15px;
            font-weight: 700;
            border-radius: var(--radius);
            border: 1px solid var(--primary-dark);
            background: linear-gradient(180deg, var(--primary-light), var(--primary));
            color: white;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
            box-shadow: 0 4px 12px rgba(13,61,32,0.25);
        }

        .card form button:hover {
            background: linear-gradient(180deg, var(--primary), var(--primary-dark));
            border-color: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(13,61,32,0.28);
        }

        .card form button:active {
            transform: translateY(0);
            box-shadow: 0 3px 10px rgba(13,61,32,0.18);
        }

        a.logout-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: var(--primary);
            font-weight: 500;
        }

        a.logout-link:hover {
            color: var(--primary-dark);
        }

        @media (max-width: 520px) {
            .card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .role-option {
                padding: 6px 10px;
            }

            .card form button {
                padding: 10px 22px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Select Active Role</h1>

    <p>Logged in as: <strong>{{ user.name }}</strong> ({{ user.email }})</p>

    <form action="/select-role" method="post">
        {% for role in roles %}
            <div class="role-option">
                <input type="radio" name="role" value="{{ role }}" id="role-{{ loop.index }}" required>
                <label for="role-{{ loop.index }}">{{ role_labels[role] }}</label>
            </div>
        {% endfor %}

        <button type="submit">Continue</button>
    </form>

    <a href="/logout" class="logout-link">Logout</a>
</div>

</body>
</html>
